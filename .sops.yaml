# sops creation rules. Each host's age key lives on that host at
# /var/lib/sops-nix/key.txt (see aspects/core/secrets.nix); only its public half
# appears here. The encrypted hosts/<host>/secret.yaml files are safe to commit.
# See the secrets repo README for how the keys are kept and shipped.
keys:
  - &vm-citrine 

creation_rules:
  - path_regex: hosts/vm-citrine/secret\.yaml$
    key_groups:
      - age:
          - *vm-citrine
